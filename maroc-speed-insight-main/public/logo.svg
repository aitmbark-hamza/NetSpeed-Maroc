<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" width="32" height="32">
  <!-- Gauge Icon in SVG - represents "NetSpeed" -->
  <defs>
    <linearGradient id="speedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="128" cy="128" r="120" fill="url(#speedGradient)" opacity="0.2"/>
  
  <!-- Inner circle -->
  <circle cx="128" cy="128" r="100" fill="none" stroke="#3b82f6" stroke-width="8"/>
  
  <!-- Gauge needle -->
  <line x1="128" y1="128" x2="128" y2="50" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <line x1="128" y1="128" x2="180" y2="100" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Center dot -->
  <circle cx="128" cy="128" r="8" fill="#3b82f6"/>
  
  <!-- Speed ticks -->
  <line x1="128" y1="35" x2="128" y2="20" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="190" y1="66" x2="202" y2="54" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="220" y1="128" x2="235" y2="128" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
</svg>
